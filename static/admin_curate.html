<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lane4 — Image Curation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:    #2563EB;
    --blue-d:  #1D4ED8;
    --blue-l:  #EFF6FF;
    --blue-m:  #BFDBFE;
    --green:   #16A34A;
    --green-l: #F0FDF4;
    --red:     #DC2626;
    --text:    #0F172A;
    --muted:   #64748B;
    --border:  #E2E8F0;
    --bg:      #F8FAFC;
    --card-bg: #FFFFFF;
    --sidebar: 252px;
    --header:  56px;
    --radius:  12px;
    --shadow:  0 2px 8px rgba(0,0,0,.08), 0 0 1px rgba(0,0,0,.06);
    --shadow-h:0 4px 20px rgba(0,0,0,.13), 0 0 1px rgba(0,0,0,.06);
  }

  html, body { height: 100%; font-family: 'Figtree', sans-serif; background: var(--bg); color: var(--text); }

  /* ── Header ─────────────────────────────────────────── */
  #hdr {
    position: fixed; inset: 0 0 auto 0; height: var(--header); z-index: 100;
    background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0; padding: 0 20px;
  }
  #hdr .logo { font-weight: 700; font-size: 1rem; letter-spacing: -.02em; color: var(--blue); flex-shrink: 0; }
  #hdr .logo span { color: var(--text); }
  #hdr .school-label { flex: 1; text-align: center; font-size: .9rem; font-weight: 600; color: var(--text); padding: 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hdr .school-label .sub { font-weight: 400; color: var(--muted); font-size: .78rem; }
  #hdr-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .hdr-btn {
    height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; font-family: inherit; font-size: .82rem; font-weight: 500; cursor: pointer;
    color: var(--text); transition: background .15s, border-color .15s;
  }
  .hdr-btn:hover { background: var(--bg); border-color: #c7d4e4; }
  .hdr-btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .hdr-btn.primary:hover { background: var(--blue-d); border-color: var(--blue-d); }
  .hdr-btn:disabled { opacity: .45; cursor: not-allowed; }
  #save-indicator { font-size: .75rem; color: var(--green); font-weight: 500; white-space: nowrap; display: none; }

  /* ── Layout ─────────────────────────────────────────── */
  #layout { display: flex; height: 100%; padding-top: var(--header); }

  /* ── Sidebar ─────────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar); flex-shrink: 0; height: 100%; overflow-y: auto;
    border-right: 1px solid var(--border); background: #fff;
    display: flex; flex-direction: column;
  }
  #sidebar-top { padding: 12px; border-bottom: 1px solid var(--border); }
  #school-search {
    width: 100%; height: 32px; border: 1px solid var(--border); border-radius: 8px;
    padding: 0 10px; font-family: inherit; font-size: .8rem; color: var(--text);
    background: var(--bg); outline: none; transition: border-color .15s;
  }
  #school-search:focus { border-color: var(--blue); }
  #school-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  #school-stats { padding: 8px 12px; border-top: 1px solid var(--border); font-size: .72rem; color: var(--muted); flex-shrink: 0; }
  .school-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; cursor: pointer; transition: background .12s;
    font-size: .8rem; font-weight: 500; color: var(--text);
  }
  .school-item:hover { background: var(--bg); }
  .school-item.active { background: var(--blue-l); color: var(--blue); }
  .school-item.active .status-dot { border-color: var(--blue); }
  .school-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--border); background: #fff;
  }
  .status-dot.has-candidates { background: var(--blue-m); border-color: var(--blue); }
  .status-dot.curated { background: var(--green); border-color: var(--green); }

  /* ── Main ─────────────────────────────────────────── */
  #main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  #main-inner { padding: 24px; display: flex; flex-direction: column; gap: 20px; min-height: 100%; }

  /* ── State overlays ─────────────────────────────────────────── */
  #state-overlay {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--muted); font-size: .95rem; padding: 60px 24px; text-align: center;
  }
  #state-overlay .icon { font-size: 2.5rem; }
  #state-overlay .title { font-weight: 600; color: var(--text); font-size: 1.1rem; }
  #state-overlay .desc { max-width: 320px; line-height: 1.5; }
  #state-overlay .cmd {
    background: #1E293B; color: #94A3B8; padding: 10px 16px; border-radius: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: .82rem; margin-top: 4px;
  }

  /* ── School header ─────────────────────────────────────────── */
  #school-hdr { display: flex; align-items: baseline; gap: 10px; }
  #school-hdr h2 { font-size: 1.25rem; font-weight: 700; }
  #school-hdr .meta { font-size: .8rem; color: var(--muted); font-weight: 400; }

  /* ── Image grid ─────────────────────────────────────────── */
  #img-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 900px)  { #img-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 650px)  { #img-grid { grid-template-columns: repeat(2, 1fr); } }

  .img-card {
    position: relative; border-radius: var(--radius); overflow: hidden;
    cursor: pointer; background: var(--bg); border: 2.5px solid transparent;
    box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s, border-color .15s;
    aspect-ratio: 4/3;
  }
  .img-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-h); }
  .img-card.selected { border-color: var(--blue); background: var(--blue-l); }
  .img-card.selected .img-card-img { opacity: .92; }

  .img-card-img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: opacity .15s;
  }
  .img-card.img-error .img-card-img { display: none; }
  .img-card.img-error::after {
    content: 'Image unavailable'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem; color: var(--muted); text-align: center;
    padding: 8px;
  }

  .img-num {
    position: absolute; bottom: 7px; left: 8px;
    background: rgba(0,0,0,.5); color: #fff; font-size: .68rem;
    font-weight: 600; border-radius: 5px; padding: 2px 6px;
    backdrop-filter: blur(4px); line-height: 1.4;
  }
  .check-badge {
    position: absolute; top: 7px; right: 8px; width: 22px; height: 22px;
    background: var(--blue); border-radius: 50%; display: none;
    align-items: center; justify-content: center;
  }
  .img-card.selected .check-badge { display: flex; }
  .check-badge svg { width: 12px; height: 12px; }

  /* ── Role selector (V2) ─────────────────────────────────────────── */
  .role-row {
    display: none; position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,.96); backdrop-filter: blur(6px);
    padding: 6px 8px; gap: 5px; flex-wrap: wrap; justify-content: center;
    border-top: 1px solid var(--border);
  }
  .img-card.selected .role-row { display: flex; }
  .role-pill {
    font-size: .65rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px; border: 1.5px solid var(--border);
    background: #fff; cursor: pointer; color: var(--muted); transition: all .12s;
    font-family: inherit;
  }
  .role-pill:hover { border-color: var(--blue); color: var(--blue); }
  .role-pill.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* ── Bottom controls ─────────────────────────────────────────── */
  #controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #controls .left { display: flex; gap: 8px; }
  #controls .right { margin-left: auto; display: flex; gap: 8px; }
  .ctrl-btn {
    height: 38px; padding: 0 18px; border-radius: 9px; border: 1px solid var(--border);
    background: #fff; font-family: inherit; font-size: .85rem; font-weight: 500; cursor: pointer;
    color: var(--text); transition: background .12s, border-color .12s;
  }
  .ctrl-btn:hover { background: var(--bg); border-color: #c7d4e4; }
  .ctrl-btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .ctrl-btn.primary:hover { background: var(--blue-d); border-color: var(--blue-d); }
  .ctrl-btn:disabled { opacity: .4; cursor: not-allowed; }
  #selection-count { font-size: .82rem; color: var(--muted); font-weight: 500; align-self: center; }

  /* ── Keyboard hint ─────────────────────────────────────────── */
  #kbd-hint {
    font-size: .72rem; color: var(--muted); line-height: 1.6;
    border-top: 1px solid var(--border); padding-top: 14px;
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  #kbd-hint .hint { display: flex; align-items: center; gap: 5px; }
  kbd { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: .7rem; font-family: inherit; }

  /* ── Loading spinner ─────────────────────────────────────────── */
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--blue);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Header -->
<header id="hdr">
  <div class="logo">Lane<span>4</span></div>
  <div class="school-label" id="hdr-school">
    <div>Image Curation</div>
    <div class="sub">Select the best candidate images for each school</div>
  </div>
  <div id="hdr-actions">
    <span id="save-indicator">✓ Saved</span>
    <button class="hdr-btn" id="hdr-prev" onclick="prevSchool()" disabled>← Prev</button>
    <button class="hdr-btn primary" id="hdr-save" onclick="saveAndNext()" disabled>Save &amp; Next →</button>
  </div>
</header>

<!-- Layout -->
<div id="layout">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-top">
      <input id="school-search" type="search" placeholder="Search schools…" oninput="filterSidebar(this.value)" />
    </div>
    <div id="school-list"><div style="padding:20px;text-align:center;"><div class="spinner" style="margin:auto"></div></div></div>
    <div id="school-stats"></div>
  </aside>

  <!-- Main -->
  <main id="main">
    <div id="main-inner">
      <div id="state-overlay">
        <div class="icon">🏊</div>
        <div class="title">Select a school to begin</div>
        <div class="desc">Choose a school from the list on the left to review its candidate images.</div>
      </div>
    </div>
  </main>

</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let SCHOOLS       = [];   // [{name, has_candidates, is_curated}]
let FILTERED      = [];   // currently shown in sidebar
let ACTIVE_IDX    = -1;   // index into SCHOOLS
let CANDIDATES    = [];   // [{url, source, width, height}] for active school
let SELECTIONS    = new Set();    // selected URLs for active school
let ROLES         = {};          // { url: 'hero'|'student_life'|'swim' }
let PENDING_SAVE  = false;
const ROLE_LABELS = { hero: 'Hero', student_life: 'Student Life', swim: 'Swim' };

// ── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const res = await fetch('/api/admin/schools');
    if (res.status === 401) { window.location = '/'; return; }
    if (!res.ok) throw new Error(await res.text());
    SCHOOLS  = await res.json();
    FILTERED = [...SCHOOLS];
    renderSidebar();
    updateStats();
    // Auto-select first school that has candidates
    const firstWithCandidates = SCHOOLS.findIndex(s => s.has_candidates);
    if (firstWithCandidates >= 0) selectSchool(firstWithCandidates);
    else if (SCHOOLS.length > 0) selectSchool(0);
  } catch (e) {
    document.getElementById('school-list').innerHTML =
      `<div style="padding:16px;color:#DC2626;font-size:.8rem">Failed to load schools: ${e.message}</div>`;
  }
});

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('school-list');
  if (!FILTERED.length) {
    el.innerHTML = '<div style="padding:16px;color:#94A3B8;font-size:.8rem;text-align:center">No schools match</div>';
    return;
  }
  el.innerHTML = FILTERED.map((s, fi) => {
    const gi = SCHOOLS.indexOf(s);
    const dotCls = s.is_curated ? 'curated' : s.has_candidates ? 'has-candidates' : '';
    const activeCls = gi === ACTIVE_IDX ? 'active' : '';
    return `<div class="school-item ${activeCls}" onclick="selectSchool(${gi})" id="si-${gi}">
      <div class="status-dot ${dotCls}"></div>
      <div class="name" title="${esc(s.name)}">${esc(s.name)}</div>
    </div>`;
  }).join('');
}

function filterSidebar(q) {
  const lq = q.toLowerCase();
  FILTERED = q ? SCHOOLS.filter(s => s.name.toLowerCase().includes(lq)) : [...SCHOOLS];
  renderSidebar();
}

function updateStats() {
  const curated   = SCHOOLS.filter(s => s.is_curated).length;
  const withCands = SCHOOLS.filter(s => s.has_candidates).length;
  document.getElementById('school-stats').textContent =
    `${curated} curated · ${withCands} with candidates · ${SCHOOLS.length} total`;
}

// ── School selection ──────────────────────────────────────────────────────────
async function selectSchool(idx) {
  if (idx < 0 || idx >= SCHOOLS.length) return;

  ACTIVE_IDX = idx;
  const school = SCHOOLS[idx];

  // Sidebar highlight
  document.querySelectorAll('.school-item').forEach(el => el.classList.remove('active'));
  const sideItem = document.getElementById(`si-${idx}`);
  if (sideItem) { sideItem.classList.add('active'); sideItem.scrollIntoView({ block: 'nearest' }); }

  // Header label
  document.getElementById('hdr-school').innerHTML =
    `<div>${esc(school.name)}</div><div class="sub">${school.is_curated ? '✓ Curated' : school.has_candidates ? 'Ready to curate' : 'No candidates harvested'}</div>`;

  // Disable controls while loading
  document.getElementById('hdr-save').disabled = true;
  document.getElementById('hdr-prev').disabled = idx === 0;

  if (!school.has_candidates) {
    showNoCandidates(school.name);
    return;
  }

  showLoading();
  try {
    const res = await fetch(`/api/admin/candidates/${encodeURIComponent(school.name)}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    CANDIDATES = data.candidates || [];
    SELECTIONS = new Set(data.curated?.selected || []);
    ROLES      = data.curated?.roles || {};
    renderGrid();
    document.getElementById('hdr-save').disabled = false;
  } catch (e) {
    showError(e.message);
  }
}

// ── Grid rendering ────────────────────────────────────────────────────────────
function renderGrid() {
  const school = SCHOOLS[ACTIVE_IDX];
  const main   = document.getElementById('main-inner');

  if (!CANDIDATES.length) { showNoCandidates(school.name); return; }

  main.innerHTML = `
    <div id="school-hdr">
      <h2>${esc(school.name)}</h2>
      <span class="meta">${CANDIDATES.length} candidates · click to select · drag after selecting</span>
    </div>
    <div id="img-grid">${CANDIDATES.map((c, i) => cardHtml(c, i)).join('')}</div>
    <div id="controls">
      <div class="left">
        <button class="ctrl-btn" onclick="prevSchool()" ${ACTIVE_IDX === 0 ? 'disabled' : ''}>← Previous</button>
      </div>
      <span id="selection-count">${countLabel()}</span>
      <div class="right">
        <button class="ctrl-btn" onclick="clearSelections()">Clear</button>
        <button class="ctrl-btn primary" onclick="saveAndNext()">Save &amp; Next →</button>
      </div>
    </div>
    <div id="kbd-hint">
      <div class="hint"><kbd>1</kbd>–<kbd>8</kbd> toggle images</div>
      <div class="hint"><kbd>Enter</kbd> save &amp; next</div>
      <div class="hint"><kbd>←</kbd><kbd>→</kbd> navigate schools</div>
    </div>`;
}

function cardHtml(c, i) {
  const sel  = SELECTIONS.has(c.url);
  const role = ROLES[c.url] || '';
  return `<div class="img-card ${sel ? 'selected' : ''}" id="card-${i}"
      onclick="toggleCard(${i})" title="${esc(c.source)} · ${c.width}×${c.height}">
    <img class="img-card-img" src="${esc(c.url)}" loading="lazy" alt="${esc(c.source)}"
         onerror="this.closest('.img-card').classList.add('img-error')" />
    <div class="img-num">${i + 1} · ${esc(c.source)}</div>
    <div class="check-badge"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg></div>
    <div class="role-row">
      ${['hero','student_life','swim'].map(r =>
        `<button class="role-pill ${role===r?'active':''}" onclick="setRole(event,${i},'${r}')">${ROLE_LABELS[r]}</button>`
      ).join('')}
    </div>
  </div>`;
}

function refreshCard(i) {
  const el = document.getElementById(`card-${i}`);
  if (!el) return;
  const c    = CANDIDATES[i];
  const sel  = SELECTIONS.has(c.url);
  const role = ROLES[c.url] || '';
  el.className = `img-card${sel ? ' selected' : ''}`;
  const pills = el.querySelectorAll('.role-pill');
  pills.forEach((p, pi) => {
    const r = ['hero','student_life','swim'][pi];
    p.classList.toggle('active', role === r);
  });
  updateCount();
}

function countLabel() {
  const n = SELECTIONS.size;
  return n === 0 ? 'No images selected' : `${n} image${n === 1 ? '' : 's'} selected`;
}
function updateCount() {
  const el = document.getElementById('selection-count');
  if (el) el.textContent = countLabel();
}

// ── Toggle / roles ────────────────────────────────────────────────────────────
function toggleCard(i) {
  const c = CANDIDATES[i];
  if (!c) return;
  if (SELECTIONS.has(c.url)) {
    SELECTIONS.delete(c.url);
    delete ROLES[c.url];
  } else {
    SELECTIONS.add(c.url);
  }
  refreshCard(i);
}

function setRole(e, i, role) {
  e.stopPropagation();
  const c = CANDIDATES[i];
  if (!c) return;
  if (ROLES[c.url] === role) {
    delete ROLES[c.url];     // toggle off
  } else {
    // clear any other card that had this role
    Object.keys(ROLES).forEach(url => { if (ROLES[url] === role) delete ROLES[url]; });
    ROLES[c.url] = role;
  }
  // Refresh all cards (role badges)
  CANDIDATES.forEach((_, idx) => refreshCard(idx));
}

function clearSelections() {
  SELECTIONS.clear();
  ROLES = {};
  CANDIDATES.forEach((_, i) => refreshCard(i));
}

// ── Save ──────────────────────────────────────────────────────────────────────
async function saveSelections() {
  if (ACTIVE_IDX < 0) return;
  const school = SCHOOLS[ACTIVE_IDX];
  const body = {
    school: school.name,
    selected: [...SELECTIONS],
    roles: ROLES,
  };
  try {
    const res = await fetch('/api/admin/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    // Mark as curated in local state
    school.is_curated = SELECTIONS.size > 0;
    // Flash indicator
    const ind = document.getElementById('save-indicator');
    ind.style.display = 'inline';
    setTimeout(() => { ind.style.display = 'none'; }, 1800);
    updateStats();
    renderSidebar();
    return true;
  } catch (e) {
    alert('Save failed: ' + e.message);
    return false;
  }
}

async function saveAndNext() {
  const ok = await saveSelections();
  if (ok) nextSchool();
}

// ── Navigation ────────────────────────────────────────────────────────────────
function nextSchool() {
  const next = ACTIVE_IDX + 1;
  if (next < SCHOOLS.length) selectSchool(next);
}
function prevSchool() {
  const prev = ACTIVE_IDX - 1;
  if (prev >= 0) selectSchool(prev);
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 8) {
    e.preventDefault();
    toggleCard(n - 1);
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveAndNext(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextSchool(); return; }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); prevSchool(); return; }
});

// ── State overlays ────────────────────────────────────────────────────────────
function showLoading() {
  document.getElementById('main-inner').innerHTML = `
    <div id="state-overlay"><div class="spinner"></div><div>Loading candidates…</div></div>`;
}
function showNoCandidates(name) {
  document.getElementById('main-inner').innerHTML = `
    <div id="state-overlay">
      <div class="icon">📭</div>
      <div class="title">No candidates for ${esc(name)}</div>
      <div class="desc">Run the candidate harvester to fetch images for this school:</div>
      <div class="cmd">python3 harvest_candidates.py --school "${esc(name)}"</div>
    </div>`;
}
function showError(msg) {
  document.getElementById('main-inner').innerHTML = `
    <div id="state-overlay">
      <div class="icon">⚠️</div>
      <div class="title">Error loading candidates</div>
      <div class="desc">${esc(msg)}</div>
    </div>`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
