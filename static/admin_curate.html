<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lane4 — Image Curation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:       #2563EB;
  --blue-d:     #1D4ED8;
  --blue-l:     #EFF6FF;
  --green:      #16A34A;
  --green-d:    #15803D;
  --green-l:    #F0FDF4;
  --green-ring: rgba(22,163,74,.22);
  --amber:      #D97706;
  --amber-l:    #FFFBEB;
  --text:       #0F172A;
  --muted:      #64748B;
  --border:     #E2E8F0;
  --bg:         #F8FAFC;
  --card-bg:    #FFFFFF;
  --sidebar:    220px;
  --header:     56px;
  --radius:     12px;
  --shadow:     0 2px 8px rgba(0,0,0,.07), 0 0 1px rgba(0,0,0,.05);
  --shadow-h:   0 6px 20px rgba(0,0,0,.13), 0 0 1px rgba(0,0,0,.06);
}

html, body { height: 100%; font-family: 'Figtree', sans-serif; background: var(--bg); color: var(--text); }

/* ── Header ─────────────────── */
#hdr {
  position: fixed; inset: 0 0 auto 0; height: var(--header); z-index: 100;
  background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
}
.logo { font-weight: 700; font-size: 1rem; letter-spacing: -.02em; color: var(--blue); flex-shrink: 0; }
.logo span { color: var(--text); }

#conf-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
#conf-wrap label { font-size: .78rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
#conf-select {
  height: 32px; border: 1px solid var(--border); border-radius: 8px;
  padding: 0 10px; font-family: inherit; font-size: .82rem; color: var(--text);
  background: var(--bg); cursor: pointer; outline: none;
}
#conf-select:focus { border-color: var(--blue); }

#hdr-progress {
  flex: 1; text-align: center; font-size: .82rem; font-weight: 600;
  color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#hdr-progress .sub { font-weight: 400; color: var(--muted); font-size: .72rem; display: block; }

#hdr-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
#save-indicator { font-size: .75rem; color: var(--green); font-weight: 600; white-space: nowrap; display: none; }
.hdr-btn {
  height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; font-family: inherit; font-size: .81rem; font-weight: 500; cursor: pointer;
  color: var(--text); transition: background .12s, border-color .12s;
}
.hdr-btn:hover { background: var(--bg); border-color: #c7d4e4; }
.hdr-btn.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.hdr-btn.primary:hover { background: var(--green-d); }
.hdr-btn:disabled { opacity: .38; cursor: not-allowed; }

/* ── Layout ─────────────────── */
#layout { display: flex; height: 100%; padding-top: var(--header); }

/* ── Sidebar ─────────────────── */
#sidebar {
  width: var(--sidebar); flex-shrink: 0; height: 100%; overflow-y: auto;
  border-right: 1px solid var(--border); background: #fff;
  display: flex; flex-direction: column;
}
#school-list { flex: 1; overflow-y: auto; padding: 6px 0; }
#school-stats {
  padding: 8px 12px; border-top: 1px solid var(--border);
  font-size: .7rem; color: var(--muted); flex-shrink: 0; line-height: 1.5;
}
.school-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; cursor: pointer; transition: background .1s;
  font-size: .79rem; font-weight: 500; color: var(--text);
}
.school-item:hover { background: var(--bg); }
.school-item.active { background: var(--green-l); color: var(--green-d); }
.school-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid var(--border); background: #fff;
}
.status-dot.partial  { background: #FDE68A; border-color: var(--amber); }
.status-dot.curated  { background: var(--green); border-color: var(--green-d); }
.status-dot.has-cands { background: #BFDBFE; border-color: var(--blue); }

/* ── Main ─────────────────── */
#main { flex: 1; overflow-y: auto; }
#main-inner { padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 24px; min-height: 100%; }

/* ── Overlay states ─────────────────── */
#state-overlay {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; color: var(--muted); font-size: .95rem; padding: 60px 24px; text-align: center;
}
#state-overlay .icon { font-size: 2.4rem; }
#state-overlay .title { font-weight: 700; color: var(--text); font-size: 1.15rem; }
#state-overlay .desc { max-width: 360px; line-height: 1.6; }
.fetch-btn {
  margin-top: 8px; padding: 12px 32px; background: var(--blue); color: #fff;
  border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: background .15s;
}
.fetch-btn:hover { background: var(--blue-d); }

/* ── School header ─────────────────── */
#school-hdr { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
#school-hdr h2 { font-size: 1.25rem; font-weight: 700; }
#school-hdr .conf-tag {
  font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 6px;
  background: var(--blue-l); color: var(--blue);
}
#school-hdr .meta { font-size: .8rem; color: var(--muted); }

/* ── Image section ─────────────────── */
.img-section {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}

.section-hdr {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg);
}
.section-icon { font-size: 1.15rem; flex-shrink: 0; }
.section-title-text { font-size: .9rem; font-weight: 700; flex: 1; }
.sel-badge {
  font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  border: 1.5px solid currentColor;
}
.sel-badge.has-sel { color: var(--green); background: var(--green-l); }
.sel-badge.no-sel  { color: var(--muted); background: transparent; border-color: var(--border); }
.skip-tag {
  font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  background: var(--amber-l); color: var(--amber); border: 1.5px solid var(--amber);
}
.saved-tag {
  font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 20px;
  background: #F0FDF4; color: var(--green); border: 1.5px solid var(--green);
  flex-shrink: 0;
}

.section-actions { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
.sec-btn {
  height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border);
  background: #fff; font-family: inherit; font-size: .78rem; font-weight: 500;
  cursor: pointer; color: var(--text); transition: background .1s;
}
.sec-btn:hover { background: var(--bg); border-color: #c7d4e4; }
.sec-btn:disabled { opacity: .38; cursor: not-allowed; }

.section-body { padding: 14px 16px; }
.section-body.loading {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; min-height: 100px; color: var(--muted); font-size: .85rem;
}
.section-body.skipped {
  display: flex; align-items: center; justify-content: center;
  min-height: 70px; color: var(--muted); font-size: .85rem; font-style: italic;
  gap: 8px;
}
.section-body.empty {
  display: flex; align-items: center; justify-content: center;
  min-height: 70px; color: var(--muted); font-size: .82rem; text-align: center;
}

/* ── Image grid ─────────────────── */
.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.img-card {
  position: relative; border-radius: 10px; overflow: hidden;
  cursor: pointer; background: #E2E8F0;
  border: 2.5px solid transparent;
  box-shadow: var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  aspect-ratio: 16/10;
}
.img-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-h); }
.img-card.selected {
  border-color: var(--green);
  box-shadow: 0 0 0 3px var(--green-ring), var(--shadow);
}
.img-card-img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.img-card.img-error .img-card-img { display: none; }
.img-card.img-error::after {
  content: 'Unavailable'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; color: var(--muted);
}

/* Source tag */
.img-src {
  position: absolute; bottom: 6px; left: 7px;
  background: rgba(0,0,0,.48); color: #fff; font-size: .62rem;
  font-weight: 500; border-radius: 5px; padding: 2px 5px;
  opacity: 0; transition: opacity .15s; pointer-events: none;
}
.img-card:hover .img-src { opacity: 1; }

/* Green check badge (top-right) */
.check-badge {
  position: absolute; top: 6px; right: 6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--green); color: #fff;
  display: none; align-items: center; justify-content: center;
  font-size: .85rem; font-weight: 700;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.img-card.selected .check-badge { display: flex; }

/* Ban button (top-left) — permanently block an image */
.ban-btn {
  position: absolute; top: 6px; left: 6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(0,0,0,.55); color: #fff;
  display: none; align-items: center; justify-content: center;
  font-size: .7rem; cursor: pointer; border: none; padding: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,.3); z-index: 10;
  line-height: 1;
}
.img-card:hover .ban-btn { display: flex; }

/* Drag-and-drop */
.img-card { cursor: grab; }
.img-card.dragging { opacity: .35; outline: 2px dashed var(--border); }
.section-body.drop-target {
  outline: 2px dashed var(--green);
  outline-offset: -4px;
  background: rgba(22,163,74,.05);
}
/* Sidebar ban-zone — lights up red when dragging a card over it */
#sidebar.ban-target {
  background: rgba(220,38,38,.08);
  outline: 3px dashed #dc2626;
  outline-offset: -6px;
}
#sidebar.ban-target::after {
  content: '🚫 Drop to ban';
  position: sticky;
  top: 50%;
  display: flex;
  justify-content: center;
  color: #dc2626;
  font-weight: 700;
  font-size: .9rem;
  pointer-events: none;
}

/* ── Bottom nav bar ─────────────────── */
#bottom-nav {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 16px 0 0;
}
#bottom-nav .left { display: flex; gap: 8px; }
#bottom-nav .right { margin-left: auto; display: flex; gap: 8px; }
.nav-btn {
  height: 38px; padding: 0 20px; border-radius: 9px; border: 1px solid var(--border);
  background: #fff; font-family: inherit; font-size: .85rem; font-weight: 500;
  cursor: pointer; color: var(--text); transition: background .12s;
}
.nav-btn:hover { background: var(--bg); border-color: #c7d4e4; }
.nav-btn.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.nav-btn.primary:hover { background: var(--green-d); }
.nav-btn:disabled { opacity: .38; cursor: not-allowed; }

/* ── Conference completion modal ─────────────────── */
#modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: none; align-items: center; justify-content: center;
  z-index: 200;
}
#modal-bg.open { display: flex; }
#modal {
  background: #fff; border-radius: 16px; padding: 32px 36px;
  max-width: 420px; width: 90%; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.22);
}
#modal h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
#modal p  { color: var(--muted); font-size: .9rem; line-height: 1.6; margin-bottom: 20px; }
#modal .modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.modal-btn {
  height: 40px; padding: 0 22px; border-radius: 9px; border: 1px solid var(--border);
  background: #fff; font-family: inherit; font-size: .88rem; font-weight: 600;
  cursor: pointer; color: var(--text); transition: background .12s;
}
.modal-btn:hover { background: var(--bg); }
.modal-btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.modal-btn.primary:hover { background: var(--blue-d); }

/* ── Spinner ─────────────────── */
.spinner {
  width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--blue);
  border-radius: 50%; animation: spin .65s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header id="hdr">
  <div class="logo">Lane<span>4</span></div>

  <div id="conf-wrap">
    <label for="conf-select">Conference</label>
    <select id="conf-select" onchange="onConfChange(this.value)">
      <option value="">Select…</option>
    </select>
  </div>

  <div id="hdr-progress">
    <span id="hdr-school-name">Image Curation</span>
    <span class="sub" id="hdr-sub">Select a conference to begin</span>
  </div>

  <div id="hdr-actions">
    <span id="save-indicator">✓ Saved</span>
    <button class="hdr-btn" id="btn-prev" onclick="prevSchool()" disabled>← Prev</button>
    <button class="hdr-btn primary" id="btn-save-next" onclick="saveAndNext()" disabled>Save &amp; Next →</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar"
         ondragover="sidebarDragOver(event)"
         ondragleave="sidebarDragLeave(event)"
         ondrop="sidebarDrop(event)">
    <div id="school-list"><div style="padding:20px;text-align:center;color:var(--muted);font-size:.8rem">Select a conference</div></div>
    <div id="school-stats"></div>
  </aside>
  <main id="main">
    <div id="main-inner">
      <div id="state-overlay">
        <div class="icon">🏊</div>
        <div class="title">Select a conference to begin</div>
        <div class="desc">Use the dropdown at the top to pick a conference, then work through its schools one by one.</div>
      </div>
    </div>
  </main>
</div>

<!-- Conference completion modal -->
<div id="modal-bg">
  <div id="modal">
    <h3 id="modal-title">Conference complete!</h3>
    <p id="modal-body"></p>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let CONF_LIST    = [];      // [{name, school_count, curated_count}]
let ACTIVE_CONF  = '';
let CONF_SCHOOLS = [];      // [{name, is_curated, has_candidates, ...}]
let CONF_IDX     = -1;      // index into CONF_SCHOOLS
let CANDIDATES   = { campus: [], pool: [], student_life: [] };
let SELECTIONS   = { campus: [], pool: [], student_life: [] };
let SAVED_SELS   = { campus: [], pool: [], student_life: [] }; // what was last saved
let SKIPPED      = { campus: false, pool: false, student_life: false };

const SECTIONS = [
  { key: 'campus',       label: 'Campus Hero Photos',    icon: '🏛',  hint: 'Select the best 3 campus/building shots' },
  { key: 'pool',         label: 'Aquatics Facility',     icon: '🏊',  hint: 'Prefer meet photos with swimmers & fans' },
  { key: 'student_life', label: 'Student Life',          icon: '🎓',  hint: 'Students on campus, walking, studying' },
];

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const res = await fetch('/api/admin/conferences');
    if (res.status === 401) { window.location = '/'; return; }
    if (!res.ok) throw new Error(await res.text());
    CONF_LIST = await res.json();
    populateConfDropdown();
  } catch (e) {
    document.getElementById('school-list').innerHTML =
      `<div style="padding:16px;color:#DC2626;font-size:.8rem">Failed: ${esc(e.message)}</div>`;
  }
});

function populateConfDropdown() {
  const sel = document.getElementById('conf-select');
  CONF_LIST.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.name;
    opt.textContent = `${c.name} (${c.curated_count}/${c.school_count})`;
    sel.appendChild(opt);
  });
}

// ── Conference change ─────────────────────────────────────────────────────────
async function onConfChange(conf) {
  if (!conf) return;
  ACTIVE_CONF = conf;
  CONF_IDX = -1;
  showOverlay('🏊', `Loading ${conf}…`, '');

  try {
    const res = await fetch(`/api/admin/schools?conference=${encodeURIComponent(conf)}`);
    if (!res.ok) throw new Error(await res.text());
    CONF_SCHOOLS = await res.json();
    renderSidebar();
    updateStats();
    updateConfDropdownLabel();

    // Start at first uncurated school, or first school if all curated
    const firstUncurated = CONF_SCHOOLS.findIndex(s => !s.is_curated);
    const startIdx = firstUncurated >= 0 ? firstUncurated : 0;
    if (CONF_SCHOOLS.length > 0) {
      selectSchool(startIdx);
    } else {
      showOverlay('📭', 'No schools found', `No schools found for ${conf}.`);
    }

    // Kick off background pre-fetch for schools that don't yet have candidates.
    // This is best-effort — errors are silently ignored so the UI stays responsive.
    const missing = CONF_SCHOOLS.filter(s => !s.has_candidates).length;
    if (missing > 0) {
      fetch('/api/admin/prefetch-conference', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conference: conf }),
      }).catch(() => {});
    }
  } catch (e) {
    showOverlay('⚠️', 'Error', e.message);
  }
}

function updateConfDropdownLabel() {
  const curated = CONF_SCHOOLS.filter(s => s.is_curated).length;
  const opt = document.querySelector(`#conf-select option[value="${CSS.escape(ACTIVE_CONF)}"]`);
  if (opt) opt.textContent = `${ACTIVE_CONF} (${curated}/${CONF_SCHOOLS.length})`;
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('school-list');
  if (!CONF_SCHOOLS.length) {
    el.innerHTML = '<div style="padding:14px;color:var(--muted);font-size:.8rem;text-align:center">No schools</div>';
    return;
  }
  el.innerHTML = CONF_SCHOOLS.map((s, i) => {
    const dotCls = s.is_curated ? 'curated'
                 : s.has_candidates ? 'has-cands' : '';
    return `<div class="school-item ${i === CONF_IDX ? 'active' : ''}" onclick="selectSchool(${i})" id="si-${i}">
      <div class="status-dot ${dotCls}"></div>
      <div class="name" title="${esc(s.name)}">${esc(s.name)}</div>
    </div>`;
  }).join('');
}

function updateStats() {
  const curated   = CONF_SCHOOLS.filter(s => s.is_curated).length;
  const withCands = CONF_SCHOOLS.filter(s => s.has_candidates).length;
  document.getElementById('school-stats').innerHTML =
    `<b>${curated}</b> curated · <b>${withCands}</b> with images · ${CONF_SCHOOLS.length} total`;
}

// ── School selection ──────────────────────────────────────────────────────────
async function selectSchool(idx) {
  if (idx < 0 || idx >= CONF_SCHOOLS.length) return;
  CONF_IDX = idx;
  const school = CONF_SCHOOLS[idx];

  // Reset state
  CANDIDATES = { campus: [], pool: [], student_life: [] };
  SELECTIONS = { campus: [], pool: [], student_life: [] };
  SAVED_SELS = { campus: [], pool: [], student_life: [] };
  SKIPPED    = { campus: false, pool: false, student_life: false };

  renderSidebar();
  const si = document.getElementById(`si-${idx}`);
  if (si) si.scrollIntoView({ block: 'nearest' });

  updateHeaderProgress(school);
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-save-next').disabled = true;

  if (!school.has_candidates) {
    autoFetchOnArrival(school.name);
    return;
  }

  showOverlay('', '', '', true);
  try {
    const res = await fetch(`/api/admin/candidates/${encodeURIComponent(school.name)}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    // Split candidates by category
    (data.candidates || []).forEach(c => {
      const cat = c.category || 'campus';
      if (CANDIDATES[cat]) CANDIDATES[cat].push(c);
    });

    // Restore previous selections if school was already curated
    const cur = data.curated || {};
    SELECTIONS.campus       = [...(cur.hero_images || [])];
    SELECTIONS.pool         = [...(cur.pool_images || [])];
    SELECTIONS.student_life = [...(cur.student_life_images || [])];
    // Track saved state so each section can show "saved" vs "modified"
    SAVED_SELS.campus       = [...SELECTIONS.campus];
    SAVED_SELS.pool         = [...SELECTIONS.pool];
    SAVED_SELS.student_life = [...SELECTIONS.student_life];

    renderSchoolView(school);
    document.getElementById('btn-save-next').disabled = false;

    // Automatically fetch more images for all 3 categories in background
    autoFetchAllCategories(school.name);

    // Background pre-fetch the next school so it's ready when we arrive
    backgroundPrefetchNext(idx);
  } catch (e) {
    showOverlay('⚠️', 'Error loading images', e.message);
  }
}

function updateHeaderProgress(school) {
  document.getElementById('hdr-school-name').textContent = school.name;
  document.getElementById('hdr-sub').textContent =
    `${ACTIVE_CONF} · School ${CONF_IDX + 1} of ${CONF_SCHOOLS.length}`;
}

// ── School view ───────────────────────────────────────────────────────────────
function renderSchoolView(school) {
  const curatedCount = CONF_SCHOOLS.filter(s => s.is_curated).length;

  const html = `
    <div id="school-hdr">
      <h2>${esc(school.name)}</h2>
      <span class="conf-tag">${esc(school.conference || ACTIVE_CONF)}</span>
      <span class="meta">${curatedCount} of ${CONF_SCHOOLS.length} curated in this conference</span>
    </div>
    ${SECTIONS.map(s => renderSection(s)).join('')}
    <div id="bottom-nav">
      <div class="left">
        <button class="nav-btn" onclick="prevSchool()" ${CONF_IDX === 0 ? 'disabled' : ''}>← Previous</button>
        <button class="nav-btn" id="btn-fetch-more" onclick="fetchMoreAll()">↻ Refresh all images</button>
      </div>
      <div class="right">
        <button class="nav-btn" onclick="skipSchool()">Skip school →</button>
        <button class="nav-btn primary" onclick="saveAndNext()">Save &amp; Next School →</button>
      </div>
    </div>`;

  document.getElementById('main-inner').innerHTML = html;
}

function renderSection(sec) {
  const { key, label, icon, hint } = sec;
  const cands   = CANDIDATES[key] || [];
  const sels    = SELECTIONS[key] || [];
  const saved   = SAVED_SELS[key] || [];
  const skip    = SKIPPED[key];
  const hasSel  = sels.length > 0;
  const hasSaved = saved.length > 0;
  // Is modified = selections differ from what was saved
  const isModified = hasSaved && JSON.stringify([...sels].sort()) !== JSON.stringify([...saved].sort());

  const badgeCls = hasSel ? 'has-sel' : 'no-sel';
  const badgeLabel = hasSel ? `${sels.length} selected` : 'none selected';
  const skipTag = skip ? `<span class="skip-tag">Skipped</span>` : '';
  // "saved" tag appears when this section has prior picks loaded from the curated manifest
  const savedTag = (!skip && hasSaved)
    ? `<span class="saved-tag" id="saved-tag-${key}" title="These selections were loaded from a previous curation session">${isModified ? '✏️ modified' : '✓ saved'}</span>`
    : `<span class="saved-tag" id="saved-tag-${key}" style="display:none"></span>`;
  // "restore" button appears when modified
  const restoreBtn = (hasSaved && !skip)
    ? `<button class="sec-btn" id="restore-btn-${key}" onclick="restoreSection('${key}')" style="${isModified ? '' : 'display:none'}">↩ Restore saved</button>`
    : '';

  return `
  <div class="img-section" id="section-${key}">
    <div class="section-hdr">
      <span class="section-icon">${icon}</span>
      <span class="section-title-text">${label}</span>
      <span class="sel-badge ${badgeCls}" id="badge-${key}">${badgeLabel}</span>
      ${savedTag}
      ${skipTag}
      <div class="section-actions">
        ${restoreBtn}
        <button class="sec-btn" id="more-btn-${key}" onclick="askMore('${key}')">↻ More images</button>
        <button class="sec-btn" id="skip-btn-${key}" onclick="skipSection('${key}')" ${skip ? 'disabled' : ''}>
          ${skip ? 'Skipped' : 'Skip this type'}
        </button>
      </div>
    </div>
    <div class="section-body ${skip ? 'skipped' : ''}" id="body-${key}"
         ondragover="dragOver(event,'${key}')" ondragleave="dragLeave(event,'${key}')"
         ondrop="dropCard(event,'${key}')">
      ${skip
        ? `<span>🚫</span><span>Skipped — no suitable images found</span>`
        : renderSectionBody(key, cands, sels, hint)
      }
    </div>
  </div>`;
}

function renderSectionBody(key, cands, sels, hint) {
  if (!cands.length) {
    return `<div class="img-grid" id="grid-${key}"></div>
      <div class="empty" style="text-align:center;padding:20px 0;color:var(--muted);font-size:.82rem">
        No images found for this category — click <strong>More images</strong> to fetch.
      </div>`;
  }
  return `<p style="font-size:.76rem;color:var(--muted);margin-bottom:10px">${hint}</p>
    <div class="img-grid" id="grid-${key}">
      ${cands.map((c, i) => cardHtml(key, c, i, sels.includes(c.url))).join('')}
    </div>`;
}

function cardHtml(key, c, i, selected) {
  const cls = selected ? 'selected' : '';
  const urlEsc = esc(c.url).replace(/'/g, "\\'");
  return `<div class="img-card ${cls}" id="card-${key}-${i}"
      draggable="true"
      ondragstart="dragStart(event,'${key}',${i})"
      ondragend="dragEnd(event,'${key}',${i})"
      onclick="toggleCard('${key}',${i})"
      title="${esc(c.source)} · ${c.width||0}×${c.height||0}">
    <img class="img-card-img" src="${esc(c.url)}" loading="lazy" alt=""
         onerror="this.closest('.img-card').classList.add('img-error')" />
    <div class="img-src">${esc(c.source)}</div>
    <div class="check-badge">✓</div>
    <button class="ban-btn" title="Never show this image again (any school)"
      onclick="event.stopPropagation(); banImage('${urlEsc}')">🚫</button>
  </div>`;
}

// ── Toggle card ────────────────────────────────────────────────────────────────
function toggleCard(key, idx) {
  const c = (CANDIDATES[key] || [])[idx];
  if (!c) return;

  const sels = SELECTIONS[key];
  const pos = sels.indexOf(c.url);
  if (pos >= 0) {
    sels.splice(pos, 1);
    document.getElementById(`card-${key}-${idx}`)?.classList.remove('selected');
  } else {
    sels.push(c.url);
    document.getElementById(`card-${key}-${idx}`)?.classList.add('selected');
  }
  refreshBadge(key);
}

// ── Ban image (global blocklist) ──────────────────────────────────────────────
async function banImage(url) {
  try {
    const res = await fetch('/api/admin/blocklist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

    // Remove from every section immediately without re-fetching
    for (const sec of SECTIONS) {
      const idx = CANDIDATES[sec.key].findIndex(c => c.url === url);
      if (idx < 0) continue;
      CANDIDATES[sec.key].splice(idx, 1);
      const si = SELECTIONS[sec.key].indexOf(url);
      if (si >= 0) SELECTIONS[sec.key].splice(si, 1);
      const body = document.getElementById(`body-${sec.key}`);
      if (body) body.innerHTML = renderSectionBody(sec.key, CANDIDATES[sec.key], SELECTIONS[sec.key], SECTIONS.find(s => s.key === sec.key)?.hint || '');
      refreshBadge(sec.key);
    }
  } catch (e) {
    alert('Could not ban image: ' + e.message);
  }
}

// ── Drag-and-drop ──────────────────────────────────────────────────────────────
let _drag = null;  // { key, idx } — fallback for same-page same-browser drags

function dragStart(e, key, idx) {
  _drag = { key, idx };
  // Store payload in dataTransfer so browsers (incl. Firefox) can recover it in drop
  e.dataTransfer.setData('application/json', JSON.stringify({ key, idx }));
  e.dataTransfer.effectAllowed = 'move';
  // Defer adding class so the browser still renders the drag ghost
  setTimeout(() => document.getElementById(`card-${key}-${idx}`)?.classList.add('dragging'), 0);
}

function dragEnd(e, key, idx) {
  // Always clean up — fires on drop, cancel, or Escape
  document.getElementById(`card-${key}-${idx}`)?.classList.remove('dragging');
  document.querySelectorAll('.section-body.drop-target').forEach(b => b.classList.remove('drop-target'));
  document.getElementById('sidebar')?.classList.remove('ban-target');
  _drag = null;
}

// ── Sidebar = ban zone ─────────────────────────────────────────────────────────
function sidebarDragOver(e) {
  if (!_drag && !e.dataTransfer.types.includes('application/json')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.getElementById('sidebar').classList.add('ban-target');
}

function sidebarDragLeave(e) {
  const sb = document.getElementById('sidebar');
  if (!sb.contains(e.relatedTarget)) {
    sb.classList.remove('ban-target');
  }
}

async function sidebarDrop(e) {
  e.preventDefault();
  document.getElementById('sidebar').classList.remove('ban-target');
  let src = null;
  try { src = JSON.parse(e.dataTransfer.getData('application/json')); } catch (_) {}
  if (!src) src = _drag;
  _drag = null;
  if (!src) return;
  const cand = CANDIDATES[src.key]?.[src.idx];
  if (!cand) return;
  await banImage(cand.url);
}

function dragOver(e, destKey) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.getElementById(`body-${destKey}`)?.classList.add('drop-target');
}

function dragLeave(e, destKey) {
  // Only remove highlight when truly leaving the section-body (not a child element)
  if (!e.relatedTarget || !e.currentTarget.contains(e.relatedTarget)) {
    document.getElementById(`body-${destKey}`)?.classList.remove('drop-target');
  }
}

function dropCard(e, destKey) {
  e.preventDefault();
  document.getElementById(`body-${destKey}`)?.classList.remove('drop-target');

  // Prefer dataTransfer payload; fall back to global _drag
  let src = null;
  try { src = JSON.parse(e.dataTransfer.getData('application/json')); } catch (_) {}
  if (!src) src = _drag;
  _drag = null;

  if (!src || src.key === destKey) return;
  moveCard(src.key, src.idx, destKey);
}

function moveCard(srcKey, srcIdx, dstKey) {
  const srcCands = CANDIDATES[srcKey] || [];
  const dstCands = CANDIDATES[dstKey] || (CANDIDATES[dstKey] = []);
  const card = srcCands[srcIdx];
  if (!card) return;

  // Move candidate
  srcCands.splice(srcIdx, 1);
  dstCands.push(card);

  // If card was selected in source, move selection too
  const srcSels = SELECTIONS[srcKey] || [];
  const selPos = srcSels.indexOf(card.url);
  if (selPos >= 0) {
    srcSels.splice(selPos, 1);
    (SELECTIONS[dstKey] || (SELECTIONS[dstKey] = [])).push(card.url);
  }

  // Re-render both section bodies in-place (fast, no full school reload)
  const srcSection = SECTIONS.find(s => s.key === srcKey);
  const dstSection = SECTIONS.find(s => s.key === dstKey);
  if (srcSection) {
    const b = document.getElementById(`body-${srcKey}`);
    if (b) b.innerHTML = renderSectionBody(srcKey, CANDIDATES[srcKey], SELECTIONS[srcKey], srcSection.hint);
  }
  if (dstSection) {
    const b = document.getElementById(`body-${dstKey}`);
    if (b) b.innerHTML = renderSectionBody(dstKey, CANDIDATES[dstKey], SELECTIONS[dstKey], dstSection.hint);
  }
  refreshBadge(srcKey);
  refreshBadge(dstKey);
}

function refreshBadge(key) {
  const sels  = SELECTIONS[key] || [];
  const saved = SAVED_SELS[key] || [];
  const n = sels.length;

  const badge = document.getElementById(`badge-${key}`);
  if (badge) {
    badge.textContent = n > 0 ? `${n} selected` : 'none selected';
    badge.className = `sel-badge ${n > 0 ? 'has-sel' : 'no-sel'}`;
  }

  // Update saved/modified indicator
  const tag = document.getElementById(`saved-tag-${key}`);
  if (tag && saved.length > 0) {
    const isModified = JSON.stringify([...sels].sort()) !== JSON.stringify([...saved].sort());
    tag.style.display = '';
    tag.textContent = isModified ? '✏️ modified' : '✓ saved';
    // Switch between green (saved) and amber (modified) styling
    if (isModified) {
      tag.style.background = 'var(--amber-l)'; tag.style.color = 'var(--amber)'; tag.style.borderColor = 'var(--amber)';
    } else {
      tag.style.background = ''; tag.style.color = ''; tag.style.borderColor = '';
    }
  }

  // Show/hide restore button
  const restoreBtn = document.getElementById(`restore-btn-${key}`);
  if (restoreBtn && saved.length > 0) {
    const isModified = JSON.stringify([...sels].sort()) !== JSON.stringify([...saved].sort());
    restoreBtn.style.display = isModified ? '' : 'none';
  }
}

// ── Skip section ───────────────────────────────────────────────────────────────
function skipSection(key) {
  SKIPPED[key] = true;
  SELECTIONS[key] = [];

  const body = document.getElementById(`body-${key}`);
  if (body) {
    body.className = 'section-body skipped';
    body.innerHTML = `<span>🚫</span><span>Skipped — no suitable images found</span>`;
  }
  const btn = document.getElementById(`skip-btn-${key}`);
  if (btn) { btn.disabled = true; btn.textContent = 'Skipped'; }

  // Add skip tag to header if not there
  const hdr = document.querySelector(`#section-${key} .section-hdr`);
  if (hdr && !hdr.querySelector('.skip-tag')) {
    const tag = document.createElement('span');
    tag.className = 'skip-tag';
    tag.textContent = 'Skipped';
    hdr.insertBefore(tag, hdr.querySelector('.section-actions'));
  }
  refreshBadge(key);
}

// ── Restore section to saved state ────────────────────────────────────────────
function restoreSection(key) {
  const saved = SAVED_SELS[key] || [];
  SELECTIONS[key] = [...saved];

  // Re-render just this section body to reflect the restored selections
  const body = document.getElementById(`body-${key}`);
  const sec  = SECTIONS.find(s => s.key === key);
  if (body && sec) {
    body.className = 'section-body';
    body.innerHTML = renderSectionBody(key, CANDIDATES[key], SELECTIONS[key], sec.hint);
  }
  refreshBadge(key);
}

// ── Auto-fetch all categories silently when a school loads ────────────────────
// Runs all 3 category searches IN PARALLEL and merges results into grids
// as each one arrives, without disrupting the current view or showing overlays.
async function autoFetchAllCategories(schoolName) {
  const fetchOne = async (sec) => {
    const key = sec.key;
    if (SKIPPED[key]) return;
    try {
      const res = await fetch('/api/admin/fetch-candidates', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ school: schoolName, category: key }),
      });
      if (!res.ok) return;
      const data = await res.json();
      const existingUrls = new Set(CANDIDATES[key].map(c => c.url));
      let added = 0;
      (data.candidates || []).forEach(c => {
        if (!existingUrls.has(c.url)) {
          CANDIDATES[key].push(c);
          existingUrls.add(c.url);
          added++;
        }
      });
      if (added > 0) {
        const body = document.getElementById(`body-${key}`);
        if (body) body.innerHTML = renderSectionBody(key, CANDIDATES[key], SELECTIONS[key], sec.hint);
      }
    } catch (_) {}
  };
  // All 3 categories fire at once — pool and student_life no longer wait for campus
  await Promise.all(SECTIONS.map(fetchOne));
}

// ── Ask for more images (targeted per-section — only runs the category-specific search) ──
async function askMore(key) {
  if (CONF_IDX < 0) return;
  const school = CONF_SCHOOLS[CONF_IDX];
  const btn = document.getElementById(`more-btn-${key}`);
  const body = document.getElementById(`body-${key}`);
  const sec  = SECTIONS.find(s => s.key === key);

  if (btn) { btn.disabled = true; btn.textContent = '↻ Fetching…'; }
  // Show spinner only inside this section body, not the others
  const prevHtml = body ? body.innerHTML : '';
  if (body) {
    body.className = 'section-body loading';
    body.innerHTML = `<div class="spinner"></div><span>Fetching ${sec?.label || key} images…</span>`;
  }

  try {
    // Pass category so the backend runs a targeted search (pool/student_life/campus)
    // instead of the generic full-school fetch which campus images dominate.
    const res = await fetch('/api/admin/fetch-candidates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ school: school.name, category: key }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

    // All returned candidates are already targeted to this section — just deduplicate
    const existingUrls = new Set(CANDIDATES[key].map(c => c.url));
    let added = 0;
    (data.candidates || []).forEach(c => {
      if (!existingUrls.has(c.url)) {
        CANDIDATES[key].push(c);
        existingUrls.add(c.url);
        added++;
      }
    });

    if (data.count > 0) school.has_candidates = true;

    // Re-render just this section body
    if (body) {
      body.className = 'section-body';
      body.innerHTML = renderSectionBody(key, CANDIDATES[key], SELECTIONS[key], sec?.hint || '');
    }

    if (added === 0) {
      const notice = document.createElement('div');
      notice.style.cssText = 'font-size:.78rem;color:var(--muted);padding:6px 0 2px';
      notice.textContent = 'No new images found — all results already shown.';
      document.getElementById(`grid-${key}`)?.after(notice);
    }
  } catch (e) {
    if (body) {
      body.className = 'section-body empty';
      body.innerHTML = `<span style="color:#DC2626">${esc(e.message)}</span>`;
    }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '↻ More images'; }
  }
}

// Refresh all sections — ONE fetch call, results distributed to each section
async function fetchMoreAll() {
  if (CONF_IDX < 0) return;
  const school = CONF_SCHOOLS[CONF_IDX];
  const allBtns = SECTIONS.map(s => document.getElementById(`more-btn-${s.key}`));
  const allBodies = SECTIONS.map(s => document.getElementById(`body-${s.key}`));

  allBtns.forEach(b => b && (b.disabled = true));
  allBodies.forEach(b => b && (b.className = 'section-body loading') && (b.innerHTML = `<div class="spinner"></div><span>Refreshing…</span>`));

  try {
    const res = await fetch('/api/admin/fetch-candidates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ school: school.name }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

    // Distribute new candidates to each section
    for (const sec of SECTIONS) {
      const newCands = (data.candidates || []).filter(c => (c.category || 'campus') === sec.key);
      const existingUrls = new Set(CANDIDATES[sec.key].map(c => c.url));
      newCands.forEach(c => { if (!existingUrls.has(c.url)) CANDIDATES[sec.key].push(c); });

      const body = document.getElementById(`body-${sec.key}`);
      if (body && !SKIPPED[sec.key]) {
        body.className = 'section-body';
        body.innerHTML = renderSectionBody(sec.key, CANDIDATES[sec.key], SELECTIONS[sec.key], sec.hint);
      }
    }

    school.has_candidates = data.count > 0;
    renderSidebar();
  } catch (e) {
    allBodies.forEach(b => b && (b.className = 'section-body empty') && (b.innerHTML = `<span style="color:#DC2626">${esc(e.message)}</span>`));
  } finally {
    allBtns.forEach(b => b && (b.disabled = false));
  }
}

// ── Save ──────────────────────────────────────────────────────────────────────
async function saveSelections() {
  if (CONF_IDX < 0) return false;
  const school = CONF_SCHOOLS[CONF_IDX];
  const body = {
    school:              school.name,
    hero_images:         [...SELECTIONS.campus],
    pool_images:         [...SELECTIONS.pool],
    student_life_images: [...SELECTIONS.student_life],
  };
  try {
    const res = await fetch('/api/admin/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    const total = body.hero_images.length + body.pool_images.length + body.student_life_images.length;
    school.is_curated = total > 0;
    // Update saved state so sections correctly show "✓ saved" vs "✏️ modified"
    SAVED_SELS.campus       = [...body.hero_images];
    SAVED_SELS.pool         = [...body.pool_images];
    SAVED_SELS.student_life = [...body.student_life_images];
    SECTIONS.forEach(s => refreshBadge(s.key));
    renderSidebar();
    updateStats();
    updateConfDropdownLabel();
    flashSaved();
    return true;
  } catch (e) {
    alert('Save failed: ' + e.message);
    return false;
  }
}

function flashSaved() {
  const ind = document.getElementById('save-indicator');
  ind.style.display = 'inline';
  setTimeout(() => { ind.style.display = 'none'; }, 1800);
}

async function saveAndNext() {
  const ok = await saveSelections();
  if (ok) nextSchool();
}

// ── Navigation ────────────────────────────────────────────────────────────────
function nextSchool() {
  const next = CONF_IDX + 1;
  if (next < CONF_SCHOOLS.length) {
    selectSchool(next);
  } else {
    showConfCompleteModal();
  }
}

function prevSchool() {
  const prev = CONF_IDX - 1;
  if (prev >= 0) selectSchool(prev);
}

function skipSchool() {
  nextSchool();
}

// ── Conference complete modal ─────────────────────────────────────────────────
function showConfCompleteModal() {
  const curated = CONF_SCHOOLS.filter(s => s.is_curated).length;
  const total   = CONF_SCHOOLS.length;

  const nextConf = getNextConf();
  document.getElementById('modal-title').textContent = `${ACTIVE_CONF} complete!`;
  document.getElementById('modal-body').textContent =
    `${curated} of ${total} schools curated in this conference.${
      nextConf ? ` Ready to move to ${nextConf.name}?` : ''
    }`;

  const btns = document.getElementById('modal-btns');
  btns.innerHTML = '';

  const stay = document.createElement('button');
  stay.className = 'modal-btn';
  stay.textContent = `Stay in ${ACTIVE_CONF}`;
  stay.onclick = () => closeModal();
  btns.appendChild(stay);

  if (nextConf) {
    const go = document.createElement('button');
    go.className = 'modal-btn primary';
    go.textContent = `Go to ${nextConf.name} →`;
    go.onclick = () => {
      closeModal();
      document.getElementById('conf-select').value = nextConf.name;
      onConfChange(nextConf.name);
    };
    btns.appendChild(go);
  }

  document.getElementById('modal-bg').classList.add('open');
}

function getNextConf() {
  const idx = CONF_LIST.findIndex(c => c.name === ACTIVE_CONF);
  return idx >= 0 && idx + 1 < CONF_LIST.length ? CONF_LIST[idx + 1] : null;
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}
document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-bg')) closeModal();
});

// ── Overlay helpers ───────────────────────────────────────────────────────────
function showOverlay(icon, title, desc, loading = false) {
  const inner = document.getElementById('main-inner');
  if (loading) {
    inner.innerHTML = `<div id="state-overlay">
      <div class="spinner" style="width:32px;height:32px"></div>
      <div style="color:var(--muted);font-size:.9rem">Loading…</div>
    </div>`;
    return;
  }
  inner.innerHTML = `<div id="state-overlay">
    ${icon ? `<div class="icon">${icon}</div>` : ''}
    ${title ? `<div class="title">${esc(title)}</div>` : ''}
    ${desc ? `<div class="desc">${esc(desc)}</div>` : ''}
  </div>`;
}

// Auto-fetch runs immediately on arrival — no button click needed.
async function autoFetchOnArrival(schoolName) {
  document.getElementById('main-inner').innerHTML = `
    <div id="state-overlay">
      <div class="spinner" style="width:32px;height:32px;margin-bottom:8px"></div>
      <div style="color:var(--muted);font-size:.9rem">Loading images for ${esc(schoolName)}…</div>
    </div>`;
  try {
    const res = await fetch('/api/admin/fetch-candidates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ school: schoolName }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    const school = CONF_SCHOOLS[CONF_IDX];
    if (school) school.has_candidates = data.count > 0;
    selectSchool(CONF_IDX);
  } catch (e) {
    showOverlay('⚠️', 'Fetch failed', e.message);
  }
}

// Fire-and-forget: start fetching the next school in the background while
// the user is working on the current one so it's ready when they arrive.
const _prefetchInFlight = new Set();
async function backgroundPrefetchNext(currentIdx) {
  const nextIdx = currentIdx + 1;
  if (nextIdx >= CONF_SCHOOLS.length) return;
  const next = CONF_SCHOOLS[nextIdx];
  if (!next || next.has_candidates || _prefetchInFlight.has(next.name)) return;
  _prefetchInFlight.add(next.name);
  try {
    const res = await fetch('/api/admin/fetch-candidates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ school: next.name }),
    });
    const data = await res.json();
    if (res.ok && data.count > 0) {
      next.has_candidates = true;
      renderSidebar();  // update sidebar dot so user can see it's ready
    }
  } catch (_) {
    // silently ignore — will auto-fetch on arrival if needed
  } finally {
    _prefetchInFlight.delete(next.name);
  }
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveAndNext(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextSchool(); return; }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); prevSchool(); return; }
});

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
