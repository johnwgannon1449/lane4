<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lane4 Admin — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Figtree', sans-serif;
  background: #F8FAFC;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: #fff;
  border: 1px solid #E2E8F0;
  border-radius: 16px;
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 4px 20px rgba(0,0,0,.07);
}
.logo { font-size: 1.3rem; font-weight: 700; color: #2563EB; margin-bottom: 4px; }
.logo span { color: #0F172A; }
.subtitle { font-size: .83rem; color: #64748B; margin-bottom: 28px; }
.field { margin-bottom: 16px; }
label { display: block; font-size: .8rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
input[type=email], input[type=password] {
  width: 100%; height: 42px; padding: 0 12px;
  border: 1px solid #E2E8F0; border-radius: 9px;
  font-family: inherit; font-size: .9rem; color: #0F172A;
  outline: none; transition: border-color .15s;
}
input[type=email]:focus, input[type=password]:focus { border-color: #2563EB; }
.error {
  margin-top: 10px; padding: 10px 12px;
  background: #FEF2F2; border: 1px solid #FECACA;
  border-radius: 8px; color: #DC2626; font-size: .82rem;
  display: none;
}
button {
  margin-top: 8px; width: 100%; height: 44px;
  background: #2563EB; color: #fff; border: none;
  border-radius: 10px; font-family: inherit; font-size: .95rem;
  font-weight: 600; cursor: pointer; transition: background .15s;
}
button:hover { background: #1D4ED8; }
button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Lane<span>4</span></div>
  <div class="subtitle">Image Curation — Admin Login</div>

  <div class="field">
    <label for="em">Email</label>
    <input type="email" id="em" placeholder="admin@example.com" autofocus
           onkeydown="if(event.key==='Enter') login()" />
  </div>
  <div class="field">
    <label for="pw">Password</label>
    <input type="password" id="pw" placeholder="Password"
           onkeydown="if(event.key==='Enter') login()" />
  </div>
  <div class="error" id="err"></div>
  <button id="btn" onclick="login()">Sign in</button>
</div>

<script>
async function login() {
  const email = document.getElementById('em').value.trim();
  const pw    = document.getElementById('pw').value;
  const btn   = document.getElementById('btn');
  const err   = document.getElementById('err');
  err.style.display = 'none';
  if (!email || !pw) {
    err.textContent = 'Email and password are required.';
    err.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    window.location.href = '/admin/curate';
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}
</script>
</body>
</html>
